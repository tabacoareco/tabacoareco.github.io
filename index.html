<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabacos Areco</title>
  
  <!-- Íconos de FontAwesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background-image: url('fondo.jpg'); 
      background-size: cover;
      background-attachment: fixed;
      background-position: center;
      background-repeat: no-repeat;
      background-color: #1a1a1a;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .side-buttons {
      position: fixed;
      top: 50%;
      left: 0;
      width: 100%;
      display: flex;
      justify-content: space-between;
      padding: 0 40px;
      transform: translateY(-50%);
      z-index: 10;
      pointer-events: none;
    }

    .btn-side {
      pointer-events: auto;
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 16px 28px;
      border-radius: 50px;
      text-decoration: none;
      font-weight: bold;
      font-size: 1.05rem;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.7);
      transition: all 0.3s ease;
    }

    /* Botón Lista de precios (PDF) */
    .btn-pdf {
      background-color: rgba(194, 141, 75, 0.95);
      color: #ffffff;
      border: 1px solid #e0a96d;
    }

    .btn-pdf:hover {
      background-color: #c28d4b;
      transform: scale(1.08) translateX(5px);
    }

    /* Botón WhatsApp */
    .btn-whatsapp {
      background-color: rgba(37, 211, 102, 0.95);
      color: #ffffff;
      border: 1px solid #20ba5a;
    }

    .btn-whatsapp:hover {
      background-color: #25d366;
      transform: scale(1.08) translateX(-5px);
    }

    /* Adaptación a celulares */
    @media (max-width: 700px) {
      body {
        overflow-y: auto;
      }

      .side-buttons {
        position: relative;
        top: 0;
        transform: none;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        margin-top: 65vh;
        padding-bottom: 40px;
      }

      .btn-side {
        width: 85%;
        justify-content: center;
      }
    }
  </style>
</head>
<body>

  <div class="side-buttons">
    <!-- Enlace a tu lista en PDF -->
    <a href="index.pdf" target="_blank" class="btn-side btn-pdf">
      <i class="fa-solid fa-file-pdf fa-lg"></i> Lista de Precios
    </a>

    <!-- Enlace directo a WhatsApp -->
    <a href="https://wa.me/5492325404049" target="_blank" class="btn-side btn-whatsapp">
      <i class="fa-brands fa-whatsapp fa-xl"></i> WhatsApp
    </a>
  </div>

</body>
</html>
