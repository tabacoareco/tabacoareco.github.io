      60% { transform: translateY(-4px); }

      padding: 0 20px;
    }

    .search-box {
      width: 100%;

      border-radius: 50px;
      border: 1px solid #c28d4b;

      font-size: 1rem;
      outline: none;
      box-shadow: 0 4px 15px rgba(0,0,0,0.5);
    }

    /* Grid */
    .catalog {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 18px;
      max-width: 1100px;
      margin: 20px auto;
      padding: 0 20px;
    }

    .card {

      border: 1px solid rgba(224, 169, 109, 0.25);
      border-radius: 16px;
      padding: 18px;
      text-align: center;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      box-shadow: 0 6px 18px rgba(0,0,0,0.5);
    }

    .card-icon { font-size: 1.7rem; color: #e0a96d; margin-bottom: 8px; }
    .card h3 { font-size: 1.05rem; margin-bottom: 6px; color: #fff; }
    .card .price { font-size: 1.2rem; font-weight: bold; color: #c28d4b; margin-bottom: 12px; }

    .card-qty-selector {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      margin-bottom: 12px;
      background: rgba(0,0,0,0.4);
      padding: 6px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,0.1);
    }

    .card-qty-btn {
      background: #c28d4b;
      color: #fff;
      border: none;
      width: 28px;
      height: 28px;
      border-radius: 50%;
      cursor: pointer;
      font-weight: bold;
      font-size: 1.1rem;
    }

    .card-qty-btn:hover { background: #e0a96d; }
    .card-qty-num { font-weight: bold; font-size: 1.05rem; min-width: 20px; }

    .btn-add {
      background-color: #25d366;
      color: #fff;
      border: none;
      padding: 10px 18px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
      transition: all 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-add:hover { background-color: #20ba5a; transform: scale(1.03); }

      display: flex;
      align-items: center;
      gap: 10px;
      z-index: 100;
